name: hobbylens
description: Identify plants and pets, get care basics, and find where to buy nearby.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  supabase_flutter: ^2.18.0
  image_picker: ^1.2.0
  google_mlkit_image_labeling: ^0.16.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
