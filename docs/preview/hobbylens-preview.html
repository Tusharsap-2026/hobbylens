<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block">
<style>
:root{
  --page:#eef2ee; --bg:#f7faf6; --surface:#ffffff; --surface2:#eef4ee; --text:#18201b; --muted:#56615a; --outline:#c4cdc5; --border:#dfe6df;
  --primary:#2e7d4f; --on-primary:#ffffff; --pc:#c6ecd2; --on-pc:#0b3a20; --sc:#dfe8d8; --on-sc:#2a3527;
  --error:#b3261e; --ec:#f9dedc; --on-ec:#410e0b; --warn:#8a5a00; --wc:#fbe9c4; --scrim:rgba(10,20,14,.45); --shadow:0 10px 40px rgba(20,40,28,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0d120f; --bg:#111613; --surface:#1a211c; --surface2:#222b25; --text:#e1e8e2; --muted:#a3ada6; --outline:#4a554d; --border:#2c362f;
  --primary:#8fd7a8; --on-primary:#003920; --pc:#155232; --on-pc:#b9f0cb; --sc:#36443a; --on-sc:#d6e6d6;
  --error:#ffb4ab; --ec:#8c1d18; --on-ec:#ffdad6; --warn:#f3c56b; --wc:#4a3a10; --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --page:#0d120f; --bg:#111613; --surface:#1a211c; --surface2:#222b25; --text:#e1e8e2; --muted:#a3ada6; --outline:#4a554d; --border:#2c362f;
  --primary:#8fd7a8; --on-primary:#003920; --pc:#155232; --on-pc:#b9f0cb; --sc:#36443a; --on-sc:#d6e6d6;
  --error:#ffb4ab; --ec:#8c1d18; --on-ec:#ffdad6; --warn:#f3c56b; --wc:#4a3a10; --scrim:rgba(0,0,0,.6); --shadow:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--text);font-family:"Noto Sans","Noto Sans Bengali",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
:lang(bn) body, .bn{font-family:"Noto Sans Bengali","Noto Sans",system-ui,sans-serif;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;width:1em;height:1em;overflow:hidden;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";flex:none;user-select:none}
.ms.fill{font-variation-settings:"FILL" 1}
.stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:16px}
.ribbon{max-width:412px;width:100%;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);margin-bottom:10px}
.ribbon .ms{font-size:18px;color:var(--warn)}
.phone{position:relative;width:100%;max-width:412px;height:min(860px,calc(100dvh - 80px));min-height:560px;background:var(--bg);border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){.stage{padding:0}.ribbon{padding:8px 16px 0;margin-bottom:6px}.phone{border-radius:0;border-left:0;border-right:0;height:calc(100dvh - 52px);min-height:0;box-shadow:none}}
.appbar{flex:none;height:56px;display:flex;align-items:center;gap:4px;padding:0 6px 0 4px;background:var(--bg)}
.appbar h1{font-size:19px;font-weight:600;margin:0 0 0 8px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.iconbtn:hover{background:var(--surface2)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.navbar{flex:none;display:flex;background:var(--surface2);border-top:1px solid var(--border);padding:8px 4px 10px}
.navbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;cursor:pointer;color:var(--muted)}
.navbar .pill{width:60px;height:32px;border-radius:16px;display:grid;place-items:center}
.navbar button.on{color:var(--text)}
.navbar button.on .pill{background:var(--pc);color:var(--on-pc)}
h2{font-size:22px;font-weight:600;margin:8px 0 12px;line-height:1.3}
h3{font-size:16px;font-weight:600;margin:20px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.italic{font-style:italic}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px}
.card + .card{margin-top:10px}
.card.err{background:var(--ec);color:var(--on-ec);border-color:transparent}
.card.tint{background:var(--surface2);border-color:transparent}
.btn{display:flex;width:100%;min-height:48px;align-items:center;justify-content:center;gap:8px;border-radius:24px;border:1px solid var(--outline);background:transparent;font-weight:600;cursor:pointer;padding:10px 18px;color:var(--primary);text-decoration:none;text-align:center}
.btn.filled{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.tonal{background:var(--pc);color:var(--on-pc);border-color:transparent}
.btn.text{border-color:transparent;width:auto;display:inline-flex;padding:8px 12px;min-height:40px}
.btn.danger{color:var(--error);border-color:var(--error)}
.btn[disabled]{opacity:.5;cursor:default}
.btn + .btn{margin-top:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:18px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-weight:600;font-size:16px;padding:12px}
.tile .ms{font-size:36px;color:var(--primary)}
.tile:hover{border-color:var(--primary)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .ms{color:var(--muted)}
.thumb{width:48px;height:48px;border-radius:12px;flex:none;overflow:hidden;display:grid;place-items:center;font-size:26px}
.thumb img{width:100%;height:100%;object-fit:cover}
.photo{width:100%;height:220px;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:96px;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:9px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.high{background:var(--pc);color:var(--on-pc)}
.chip.medium{background:var(--sc);color:var(--on-sc)}
.chip.low{background:var(--ec);color:var(--on-ec)}
.chip.stock{background:var(--pc);color:var(--on-pc)}
.chip.likely{background:var(--sc);color:var(--on-sc)}
.chip.open{color:var(--primary);padding-left:0}
.chip.closed{color:var(--muted);padding-left:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid var(--outline);background:transparent;border-radius:9px;padding:7px 14px;font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fchip.on{background:var(--sc);color:var(--on-sc);border-color:transparent}
.fchip.on::before{content:"✓";font-weight:700}
.note{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:13.5px;margin:10px 0}
.note .ms{font-size:18px;margin-top:1px}
.tip{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.tip:first-of-type{border-top:0}
.tip b{display:block;font-size:13.5px}
.tip .ms{color:var(--primary)}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--wc);color:var(--warn)}
.shop{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 14px 10px;margin-top:10px}
.shop .name{font-weight:600;font-size:16px;cursor:pointer}
.shop .acts{display:flex;gap:6px;margin-top:10px}
.shop .acts .btn{flex:1;min-height:40px;padding:6px 8px;font-size:13.5px;margin:0}
.radio{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
.radio input{width:20px;height:20px;accent-color:var(--primary);margin:0}
label.field{display:block;margin:12px 0}
label.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.input{width:100%;min-height:48px;border:1px solid var(--outline);border-radius:10px;background:var(--surface);padding:10px 12px}
.input:focus{outline:2px solid var(--primary);border-color:transparent}
.err-text{color:var(--error);font-size:13px;margin-top:4px}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20;animation:fade .15s}
.scrim.center{align-items:center;justify-content:center;padding:24px}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px 20px;animation:up .2s ease-out}
.sheet .grab{width:32px;height:4px;border-radius:2px;background:var(--outline);margin:4px auto 12px}
.dialog{width:100%;max-width:340px;background:var(--surface);border-radius:24px;padding:22px 22px 14px}
.dialog h3{margin-top:0;font-size:19px}
.dialog .acts{display:flex;justify-content:flex-end;gap:4px;margin-top:14px;flex-wrap:wrap}
.snack{position:absolute;left:12px;right:12px;bottom:84px;background:#2c322e;color:#eef3ef;padding:13px 16px;border-radius:8px;z-index:30;box-shadow:var(--shadow);animation:up .2s}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.sample{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:0;cursor:pointer;overflow:hidden;text-align:left}
.sample .art{height:78px;display:grid;place-items:center;font-size:42px}
.sample .cap{padding:7px 9px;font-size:12.5px;line-height:1.3}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--pc);border-top-color:var(--primary);animation:spin 1s linear infinite;margin:24px auto 12px}
.logo{width:72px;height:72px;border-radius:22px;background:var(--pc);color:var(--on-pc);display:grid;place-items:center;margin:20px 0 8px}
.logo .ms{font-size:42px}
.hours{width:100%;border-collapse:collapse;font-size:14px}
.hours td{padding:5px 0;border-bottom:1px solid var(--border)}
.hours td:last-child{text-align:right}
.hours tr.today td{font-weight:700}
.kv{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.kv .ms{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.big-number{font-size:22px;font-weight:700;letter-spacing:.04em;text-align:center;padding:12px;background:var(--surface2);border-radius:12px;margin:10px 0}
.msgbox{background:#dcf8c6;color:#111;border-radius:10px 10px 2px 10px;padding:10px 12px;margin:10px 0 10px 30px}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}
.center{text-align:center}
.hidden{display:none!important}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<div class="stage">
  <div class="ribbon" id="ribbon"></div>

    <div class="appbar" id="appbar"></div>
    <div class="content" id="content"></div>
    <nav class="navbar" id="navbar"></nav>
    <div id="overlay"></div>
    <div id="snack"></div>
  </div>
</div>

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function t(key, params){
  let s = (L[S.lang] && L[S.lang][key]) ?? L.en[key] ?? PV[S.lang][key] ?? PV.en[key] ?? key;
  if (key === "everyNDays") {
    const m = s.match(/=1\{([^}]*)\}\s*other\{(.*)\}\s*\}$/);
    if (m) s = params.days === 1 ? m[1] : m[2];
  }
  if (params) for (const [k, v] of Object.entries(params)) s = s.split("{" + k + "}").join(v);
  return s;
}

/* ---------- data helpers ---------- */
const taxaByKey = Object.fromEntries(DATA.taxa.map(x => [x.key, x]));
const taxaById = Object.fromEntries(DATA.taxa.map(x => [x.id, x]));
const catsById = Object.fromEntries(DATA.cats.map(c => [c.id, c]));
const isAnimal = k => k === "cat" || k === "dog" || k === "bird";
const kindLabel = k => t({plant:"categoryPlant", cat:"categoryCat", dog:"categoryDog", bird:"categoryBird"}[k] || "categoryAuto");
const BAND_SCORE = {high:.9, medium:.7, low:.4};
const bandFor = p => p >= .8 ? "high" : p >= .6 ? "medium" : "low";

function careFor(taxonId, kind){
  const own = taxonId && DATA.cards.find(c => c.taxon === taxonId);
  if (own && own.tips && own.tips.length) return {status: own.status, fallback:false, tips: own.tips};
  if (isAnimal(kind)) { const g = DATA.cards.find(c => c.kind === kind); if (g) return {status:g.status, fallback:true, tips:g.tips}; }
  return null;
}
function matchFromTaxon(tx, conf, band){
  return {taxonId:tx.id, key:tx.key, kind:tx.kind, sci:tx.sci, en:tx.en, bn:tx.bn, safety:tx.safety, confidence:conf, band: band || bandFor(conf)};
}
function findTaxon(kind, names){
  const list = DATA.taxa.filter(x => !kind || x.kind === kind);
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
  const ns = names.map(norm).filter(Boolean);
  for (const n of ns) { const hit = list.find(x => x.match.includes(n) || norm(x.sci) === n || norm(x.en) === n); if (hit) return hit; }
  for (const n of ns) { const g = n.split(" ")[0]; const hit = list.find(x => x.genus && norm(x.genus) === g && x.kind === "plant"); if (hit) return hit; }
  if (kind === "cat" || kind === "dog") {
    if (ns.some(n => /mixed|local|domestic|deshi|street|stray/.test(n))) return taxaByKey[kind + "_local"];
  }
  return null;
}

  const o = sample.out;
  const matches = o.matches.map(([ref, c]) => {
    const conf = typeof c === "number" ? c : BAND_SCORE[c];
    const band = typeof c === "number" ? bandFor(c) : c;
    if (typeof ref === "string") return matchFromTaxon(taxaByKey[ref], conf, band);
    return {taxonId:null, key:null, kind:ref.kind, sci:ref.sci, en:ref.en, bn:null, safety:null, confidence:conf, band};
  });
  return {status:o.status, requested, detected:o.detected, vet:!!o.vet, matches};
}

/* ---------- geography (demo origin: GEC Circle) ---------- */
const ORIGIN = {lat:22.3584, lng:91.8203};
function distM(a, b){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng/2)**2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
const DAYS = ["sun","mon","tue","wed","thu","fri","sat"];
function dhakaNow(){ const n = new Date(Date.now() + 6 * 3600 * 1000); return {day: DAYS[n.getUTCDay()], mins: n.getUTCHours() * 60 + n.getUTCMinutes()}; }
function openNow(shop){
  if (!shop.hours) return null;
  const {day, mins} = dhakaNow();
  const ranges = shop.hours[day] || [];
  const toM = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  return ranges.some(([a, b]) => mins >= toM(a) && mins < toM(b));
}
function nearby({radius, kind, taxonId, types}){
  const tx = taxonId ? taxaById[taxonId] : null;
  const ts = types || (kind == null ? null : kind === "plant" ? ["nursery"] : ["pet_shop","vet_supply"]);
  return DATA.shops
    .filter(s => !ts || ts.includes(s.type))
    .map(s => {
      const d = distM(ORIGIN, s);
      let catMatch = false;
      if (tx && tx.cat) catMatch = (s.cats || []).includes(tx.cat);
      else if (kind) catMatch = (s.cats || []).some(c => (catsById[c]?.kinds || []).includes(kind));
      const st = taxonId ? (s.stock || []).find(x => x.taxon === taxonId) : null;
      return {...s, dist:d, catMatch, inStock:!!st, stockPrice: st ? st.price : null, open: openNow(s)};
    })
    .filter(s => s.dist <= radius * 1000)
    .sort((a, b) => (b.inStock - a.inStock) || (b.catMatch - a.catMatch) || (a.dist - b.dist));
}
const shopTypeLabel = ty => t({nursery:"shopNursery", pet_shop:"shopPetShop", vet_supply:"shopVetSupply", vet_clinic:"shopVetClinic"}[ty]);
const distLabel = m => m < 1000 ? t("distanceM", {distance: num(Math.round(m / 10) * 10)}) : t("distanceKm", {distance: num(m / 1000, 1)});

function accessoriesFor(kind, taxonId){
  const out = [];
  for (const it of DATA.items) {
    const suits = (it.suits || []).filter(s => (taxonId && s.taxon === taxonId) || (!s.taxon && s.kind === kind));
    if (!suits.length) continue;
    const own = suits.find(s => s.taxon === taxonId);
    out.push({...it, essential: own ? own.ess : suits.some(s => s.ess)});
  }
  return out;
}

function photoHTML(photo, cls = "photo"){
  if (!photo) return `<div class="${cls}" style="background:var(--surface2)">${icon("image")}</div>`;
  if (photo.sample) { const s = SAMPLES.find(x => x.id === photo.sample); return `<div class="${cls}" style="background:${s.bg}">${s.emoji}</div>`; }
  return `<div class="${cls}"><img alt="" src="${esc(photo.url)}"></div>`;
}
function resize(file, max){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve({blob:b, url:c.toDataURL("image/jpeg", .82)}) : reject(new Error("photo")), "image/jpeg", .82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("photo")); };
    img.src = url;
  });
}
async function thumb(photo){
  if (!photo || photo.sample) return photo;
  try { const r = await fetch(photo.url); const b = await r.blob(); const s = await resize(b, 320); return {url:s.url}; } catch(e) { return null; }
}

/* ---------- identification ---------- */
function startIdentify(photo, requested, sample){
  const screen = {name:"identifying", photo, requested, slow:false, ctl:new AbortController()};
  push(screen);
  const finish = (res) => {
    if (cur() !== screen) return;
    S.recent.unshift({at:Date.now(), lang:true, confident: res.status === "confident",
      title: res.status === "confident" ? {en:res.matches[0].en, bn:res.matches[0].bn} : {en:L.en[res.status === "low_confidence" ? "lowConfidenceTitle" : "notRecognisedTitle"], bn:L.bn[res.status === "low_confidence" ? "lowConfidenceTitle" : "notRecognisedTitle"]},
      res, photo: photo.sample ? photo : null});
    S.recent = S.recent.slice(0, 8); persist();
    replaceTop({name:"result", res, photo, sel:0, aiCare:{}});
  };
  if (sample) { setTimeout(() => finish(buildDemoResult(sample, requested)), 1300); return; }
  setTimeout(() => { if (cur() === screen) { screen.slow = true; render(); } }, 7000);
  identifyLive(photo, requested, screen.ctl.signal).then(finish).catch(e => {
    if (cur() !== screen) return;
    const code = e && e.code;
    if (code === "cancelled") return;
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"].includes(code)) {
      S.liveBlocked = true; S.stack.pop(); render(); sheet({type:"outcome", photo, requested}); return;
    }
    const msg = code === "image_rejected" ? t("errorPhoto") : code === "rate_limited" ? t("errorQuota", {limit: num(10)}) : t("errorServer");
    replaceTop({name:"error", photo, requested, message: msg});
  });
}

const IDENTIFY_PROMPT = (requested) => `You identify plants and pets from one photo for a hobbyist app in Bangladesh. The attached image is the user's photo.
${requested === "auto" ? "First decide whether the photo shows a plant, a cat, a dog, a bird, or something else." : `The user says the photo shows a ${requested}. If it clearly does not, set "category" to what it does show.`}
Rules:
- Never diagnose illness. If the animal or plant looks unwell, set "health_concern_visible" to true and say nothing else about it.
- For cats and dogs, give the likely breed. Most cats and dogs in Bangladesh are local or mixed breed: say "Mixed breed cat" or "Mixed breed dog" when no recognised breed fits well.
- For birds and plants, give the scientific name.
- Give at most 3 candidates, best first. For plants give "probability" (0 to 1, honest; the three should not sum above 1). For animals give a "confidence" band: "high" only when you are sure.
- Add the usual Bangla common name in "common_name_bn" when one is widely used, otherwise null.
- If the photo is blurred, too dark, or shows no plant, cat, dog or bird, set "image_usable" to false or "category" to "other".
Reply with only JSON in exactly this shape:
{"category":"plant|cat|dog|bird|other","image_usable":true,"health_concern_visible":false,"candidates":[{"name":"scientific name or breed","common_name_en":"English common name","common_name_bn":"বাংলা নাম or null","probability":0.0,"confidence":"high|medium|low"}]}`;

async function identifyLive(photo, requested, signal){
  const j = await S.live.json(IDENTIFY_PROMPT(requested), {images:[photo.blob], modelTier:"default", signal, cache:false});
  const cats = ["plant","cat","dog","bird","other"];
  const category = cats.includes(j && j.category) ? j.category : "other";
  const cands = (Array.isArray(j && j.candidates) ? j.candidates : []).filter(c => c && c.name).slice(0, 3);
  if (j?.image_usable === false || category === "other" || !cands.length) return {status:"not_recognised", requested, detected:null, vet:false, matches:[]};
  const merged = [];
  for (const c of cands) {
    const isPlant = category === "plant";
    const band = ["high","medium","low"].includes(c.confidence) ? c.confidence : "low";
    let conf = isPlant && typeof c.probability === "number" ? Math.max(0, Math.min(1, c.probability)) : BAND_SCORE[band];
    const tx = findTaxon(category, [c.name, c.common_name_en]);
    const prev = tx && merged.find(m => m.taxonId === tx.id);
    if (prev) { prev.confidence = Math.min(1, prev.confidence + (isPlant ? conf : 0)); if (isPlant) prev.band = bandFor(prev.confidence); continue; }
    if (tx) merged.push(matchFromTaxon(tx, conf, isPlant ? bandFor(conf) : band));
    else merged.push({taxonId:null, key:null, kind:category, sci:String(c.name).slice(0, 120), en:String(c.common_name_en || c.name).slice(0, 120), bn: c.common_name_bn ? String(c.common_name_bn).slice(0, 120) : null, safety:null, confidence:conf, band: isPlant ? bandFor(conf) : band});
  }
  merged.sort((a, b) => b.confidence - a.confidence);
  const status = merged[0].confidence >= .6 ? "confident" : "low_confidence";
  return {status, requested, detected:category, vet: j.health_concern_visible === true && category !== "plant", matches:merged};
}

async function loadAiCare(s){
  const m = s.res.matches[s.sel || 0];
  const idx = s.sel || 0;
  s.loadingCare = true; render();
  const topics = m.kind === "plant" ? "light, water, soil, temperature, fertiliser" : "food, space, grooming, exercise, vaccination";
  try {
    const j = await S.live.json(`You write short, general care guidance for a hobbyist app in Bangladesh, for: ${m.sci} (${m.en}), a ${m.kind}.
Give 3 to 5 tips, each one or two plain sentences of at most 200 characters, in English ("en") and natural Bangla ("bn"). Topics come from: ${topics}. Never give medical or dosage advice; for any health problem say to consult a vet.
Reply with only JSON: {"tips":[{"topic":"water","en":"...","bn":"..."}]}`, {modelTier:"quick"});
    const tips = (Array.isArray(j && j.tips) ? j.tips : []).filter(x => x && x.en).slice(0, 5).map(x => ({topic:String(x.topic || ""), en:String(x.en).slice(0, 240), bn: x.bn ? String(x.bn).slice(0, 300) : null}));
    if (tips.length) s.aiCare[idx] = {status:"ai_generated", fallback:false, tips};
  } catch(e) { if (e && e.code !== "cancelled") snack(t("errorServer")); }
  s.loadingCare = false; if (cur() === s) render();
}

async function onFile(input){
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  const cat = S.overlay && S.overlay.cat || "auto";
  closeOverlay();
  let photo;
  try { const r = await resize(f, 1024); photo = {blob:r.blob, url:r.url}; }
  catch(e) { snack(t("errorPhoto")); return; }
  if (S.live && S.liveImages && !S.liveBlocked) startIdentify(photo, cat, null);
  else sheet({type:"outcome", photo, requested:cat});
}

    const photo = await thumb(s.photo);
    const item = {id: String(Date.now()), taxonId:m.taxonId, kind:m.kind, sci:m.sci, en:m.en, bn:m.bn, nickname:"", photo, savedAt:Date.now(), reminders:[]};
    if (!S.phone) { S.pendingSave = item; push({name:"signin"}); return; }
    S.collection.unshift(item); persist(); snack(t("savedToCollection"));
  },
  verifyPhone(){ push({name:"signin"}); },
  sendCode(){
    const s = cur(); const raw = document.getElementById("phoneIn").value.replace(/[\s-]/g, "");
    const digits = raw.replace(/[০-৯]/g, d => "০১২৩৪৫৬৭৮৯".indexOf(d));
    const m = digits.match(/^(?:\+?88)?(01[3-9]\d{8})$/);
    s.phone = raw;
    if (!m) { s.phoneErr = true; render(); return; }
    s.phoneErr = false; s.normalised = "+88" + m[1]; s.codeSent = true; render();
    setTimeout(() => document.getElementById("codeIn")?.focus(), 50);
  },

    if (!/^\d{6}$/.test(code)) { s.codeErr = true; render(); return; }
    S.phone = s.normalised; S.stack.pop();
    if (S.pendingSave) { S.collection.unshift(S.pendingSave); S.pendingSave = null; persist(); render(); snack(t("savedToCollection")); }

  saveNick(){ const c = S.collection.find(x => x.id === cur().id); c.nickname = document.getElementById("nickIn").value.trim().slice(0, 60); persist(); render(); snack(t("save") + " ✓"); },

  addReminder(){ const c = S.collection.find(x => x.id === cur().id); sheet({type:"reminder", kind:c.kind, ty: REMINDER_TYPES(c.kind)[0]}); },
  remType(el){ S.overlay.ty = el.dataset.ty; document.querySelectorAll("#remTypes .fchip").forEach(b => b.classList.toggle("on", b === el)); },
  saveReminder(){
    const d = document.getElementById("remDate").value, tm = document.getElementById("remTime").value;
    const when = new Date(d + "T" + (tm || "09:00"));
    if (!d || isNaN(when) || when.getTime() <= Date.now()) { document.getElementById("remErr").textContent = t("reminderInPast"); return; }
    const c = S.collection.find(x => x.id === cur().id);
    c.reminders.push({id:String(Date.now()), type:S.overlay.ty, label:document.getElementById("remLabel").value.trim(), next:when.getTime(), every:+document.getElementById("remRepeat").value || null});
    persist(); closeOverlay(); render();
  },
  doneReminder(el){
    const c = S.collection.find(x => x.id === cur().id); const r = c.reminders.find(x => x.id === el.dataset.rid);
    if (r.every) { let n = r.next; while (n <= Date.now()) n += r.every * 864e5; if (n === r.next) n += r.every * 864e5; r.next = n; }
    else c.reminders = c.reminders.filter(x => x !== r);
    persist(); render();
  },
  delReminder(el){ const c = S.collection.find(x => x.id === cur().id); c.reminders = c.reminders.filter(x => x.id !== el.dataset.rid); persist(); render(); },
  deleteItem(){ const id = cur().id; sheet({type:"confirm", text:t("deleteItemConfirm"), yes:t("delete"), run(){ S.collection = S.collection.filter(x => x.id !== id); persist(); pop(); }}); },
  confirmYes(){ const o = S.overlay; closeOverlay(); o.run(); },
  signOut(){ S.phone = null; persist(); render(); },
  deleteAccount(){ sheet({type:"confirm", text:t("deleteAccountConfirm"), yes:t("delete"), run(){
    S.collection = []; S.recent = []; S.phone = null; S.onboarded = false; S.located = false; S.stack = []; S.tab = "identify";
    ["recent","collection","phone","onboarded"].forEach(store.del); render(true); snack(t("accountDeleted")); }}); },
  about(){ sheet({type:"info", title:t("disclaimerTitle"), text:t("disclaimerBody")}); },
};

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-a]");
  if (!el || el.tagName === "INPUT") return;
  const fn = A[el.dataset.a];
  if (fn) { fn(el, ev); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.a === "lang") A.lang(el);
  if (el.id === "fileCam" || el.id === "fileGal") onFile(el);
});

render(true);

/* Live identification lights up only when this view can ask Claude with images. */
(async () => {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const sample = await window.claude.use("sample");
    if (!sample) return;
    S.live = sample;
    const lim = await sample.limits().catch(() => null);
    S.liveImages = !!(lim && lim.images);
    if (S.overlay) renderOverlay();
    if (cur() && cur().name === "result") render();
  } catch(e) {}
})();
</script>
